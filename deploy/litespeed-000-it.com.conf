# OpenLiteSpeed / CyberPanel for https://000-it.com
#
# On this VPS:
#   - https://000-it.com  → LiteSpeed (CyberPanel) on :443
#   - http://000-it.com   → nginx on :80 (ACME + redirect)
#   - Node/PM2 "000-it"   → 127.0.0.1:3066
#
# Append to /usr/local/lsws/conf/vhosts/000-it.com/vhost.conf (keep existing PHP/SSL blocks):

# Cron POSTs (/api/cron/*) can run for a few minutes. Keep GitHub deadlineMs
# under CyberPanel Tuning → Connection Timeout (default 300s) or OLS returns 500.
extprocessor 000it_next {
  type                    proxy
  address                 127.0.0.1:3066
  maxConns                100
  pcKeepAliveTimeout      60
  initTimeout             300
  retryTimeout            0
  respBuffer              0
}

context / {
  type                    proxy
  handler                 000it_next
  addDefaultCharset       off
}

# Then: /usr/local/lsws/bin/lswsctrl restart
# SSL files: /etc/letsencrypt/live/000-it.com/{fullchain,privkey}.pem
