# OpenLiteSpeed / CyberPanel — ExtraHosting (.eu + .nl)
# Proxy to PM2 "extrahosting" on 127.0.0.1:3067 (same app tree as 000-it.com).
#
# Apply on VPS (as root):
#   bash scripts/setup-extrahosting-litespeed.sh
#
# Or manually: append the extprocessor + context / blocks below into each
#   /usr/local/lsws/conf/vhosts/extrahosting.{eu,nl}/vhost.conf
# then: /usr/local/lsws/bin/lswsctrl restart
#
# Keep ACME challenge + vhssl from CyberPanel. Do NOT use nginx for these hosts.

extprocessor extrahosting_next {
  type                    proxy
  address                 127.0.0.1:3067
  maxConns                100
  pcKeepAliveTimeout      60
  initTimeout             300
  retryTimeout            0
  respBuffer              0
}

# Optional webmail (same pattern as 000-it.com) — only if Roundcube is installed:
# context /webmail/ {
#   type                    static
#   location                /home/cyberpanel/roundcube/public_html/
#   allowBrowse             1
#   indexFiles              index.php
# }

context / {
  type                    proxy
  handler                 extrahosting_next
  addDefaultCharset       off
}
