# Nginx :80 for https://000-it.com
# On this VPS port 80 is nginx; port 443 is OpenLiteSpeed (CyberPanel).
#
#   sudo cp deploy/nginx-000-it.com.conf /etc/nginx/conf.d/000-it.com.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name 000-it.com www.000-it.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
