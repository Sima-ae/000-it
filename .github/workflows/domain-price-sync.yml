# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Domain price sync (weekly)

# Friday 00:00 CET = Thursday 23:00 UTC (CET = UTC+1).
# Namecheap and Regery stay strictly isolated:
#   - Namecheap updates only Sync rows (manualPricing=false)
#   - Regery updates only Manual rows (manualPricing=true)
on:
  schedule:
    - cron: "0 23 * * 4"
  workflow_dispatch:

concurrency:
  group: domain-price-sync-weekly
  cancel-in-progress: false

jobs:
  namecheap:
    name: Sync Namecheap domain prices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Namecheap price sync on VPS
        env:
          APP_URL: ${{ secrets.AUTO_NEWS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE_URL="${APP_URL:-https://000-it.com}"
          URL="${BASE_URL%/}/api/cron/domain-prices"
          echo "POST ${URL}"
          HTTP=$(curl -sS -o /tmp/domain-prices-nc.json -w "%{http_code}" -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 180 \
            "$URL")
          echo "HTTP ${HTTP}"
          head -c 4000 /tmp/domain-prices-nc.json; echo
          if [[ "$HTTP" != "200" ]]; then
            echo "Namecheap domain price sync failed with HTTP ${HTTP}"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("/tmp/domain-prices-nc.json","utf8"));
            if (data.ok === false) process.exit(1);
            if (data.source && data.source !== "namecheap") {
              console.error("Unexpected source", data.source);
              process.exit(1);
            }
            console.log(JSON.stringify({
              source: data.source || "namecheap",
              updated: data.updated,
              created: data.created,
              transferUpdated: data.transferUpdated,
              restoreUpdated: data.restoreUpdated,
              rate: data.exchangeRateUsed,
            }, null, 2));
          '

  regery:
    name: Sync Regery domain prices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: namecheap
    if: always()
    steps:
      - name: Trigger Regery price sync on VPS
        env:
          APP_URL: ${{ secrets.AUTO_NEWS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE_URL="${APP_URL:-https://000-it.com}"
          URL="${BASE_URL%/}/api/cron/domain-prices-regery"
          echo "POST ${URL}"
          HTTP=$(curl -sS -o /tmp/domain-prices-rg.json -w "%{http_code}" -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 300 \
            "$URL")
          echo "HTTP ${HTTP}"
          head -c 4000 /tmp/domain-prices-rg.json; echo
          if [[ "$HTTP" != "200" ]]; then
            echo "Regery domain price sync failed with HTTP ${HTTP}"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("/tmp/domain-prices-rg.json","utf8"));
            if (data.ok === false) process.exit(1);
            if (data.source !== "regery") {
              console.error("Unexpected source", data.source);
              process.exit(1);
            }
            console.log(JSON.stringify({
              source: data.source,
              fetched: data.fetched,
              created: data.created,
              updated: data.updated,
              unchanged: data.unchanged,
              skippedNamecheapOwned: data.skippedNamecheapOwned,
            }, null, 2));
          '
