# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Publishes 3 bilingual /nieuws posts every day at 12:00 Europe/Amsterdam (21/week).
# GitHub cron is UTC-only, so we hit 10:00 and 11:00 UTC; the API no-ops unless Amsterdam hour is 12.
name: Auto news (daily 12:00 CET)

on:
  schedule:
    # 10:00 UTC = 12:00 CEST (summer), 11:00 UTC = 12:00 CET (winter)
    - cron: "0 10,11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force run outside the 12:00 Amsterdam window"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: auto-news
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish news posts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger auto-news endpoint
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          APP_URL: ${{ secrets.AUTO_NEWS_APP_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${APP_URL:-https://000-it.com}"
          FORCE_FLAG=""
          if [[ "${FORCE}" == "true" ]]; then
            FORCE_FLAG="&force=1"
          fi
          URL="${BASE_URL%/}/api/cron/auto-news?limit=3${FORCE_FLAG}"
          echo "POST ${BASE_URL%/}/api/cron/auto-news?limit=3..."
          curl -fsS -X POST \
            -H "Accept: application/json" \
            --max-time 280 \
            "$URL" | tee /tmp/auto-news.json
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("/tmp/auto-news.json","utf8"));
            console.log(JSON.stringify({
              ok: data.ok,
              skipped: data.skipped,
              reason: data.reason,
              published: (data.published||[]).length,
              errors: (data.errors||[]).length,
              date: data.date,
              weekday: data.weekday,
              hour: data.hour,
            }, null, 2));
            if (data.ok === false && !data.skipped) process.exit(1);
          '
