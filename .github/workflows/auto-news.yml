# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Publishes 3 multilingual /nieuws posts every day (EN source → all locales, NL default).
# GitHub cron is UTC-only and often delayed; scheduled runs always use force=1.
# The API still caps at `limit` posts per Amsterdam day (auto-{date}-*) unless
# ignoreDailyCap=1 is passed.
name: Auto news (daily 00:00 CET)

on:
  schedule:
    # Cover CET (23:00 UTC) and CEST (22:00 UTC) plus one backup slot for Actions drift
    - cron: "0 21,22,23 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force run outside the Amsterdam night window"
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: auto-news
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish news posts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger auto-news endpoint
        env:
          FORCE: ${{ github.event.inputs.force || 'true' }}
          EVENT_NAME: ${{ github.event_name }}
          APP_URL: ${{ secrets.AUTO_NEWS_APP_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${APP_URL:-https://000-it.com}"
          FORCE_FLAG=""
          # Scheduled runs always force — hour-0 windows are easy to miss with Actions lag.
          if [[ "${EVENT_NAME}" == "schedule" ]] || [[ "${FORCE}" == "true" ]]; then
            FORCE_FLAG="&force=1"
          fi
          URL="${BASE_URL%/}/api/cron/auto-news?limit=3${FORCE_FLAG}"
          echo "POST ${BASE_URL%/}/api/cron/auto-news?limit=3..."
          HTTP=$(curl -sS -o /tmp/auto-news.json -w "%{http_code}" -X POST \
            -H "Accept: application/json" \
            --max-time 280 \
            "$URL")
          echo "HTTP ${HTTP}"
          head -c 4000 /tmp/auto-news.json; echo
          HTTP_CODE="$HTTP" node -e '
            const fs = require("fs");
            const http = process.env.HTTP_CODE;
            if (http !== "200") {
              console.error("auto-news failed with HTTP", http);
              process.exit(1);
            }
            const data = JSON.parse(fs.readFileSync("/tmp/auto-news.json","utf8"));
            console.log(JSON.stringify({
              ok: data.ok,
              skipped: data.skipped,
              reason: data.reason,
              published: (data.published||[]).length,
              errors: (data.errors||[]).length,
              date: data.date,
              weekday: data.weekday,
              hour: data.hour,
            }, null, 2));
            if (data.ok === false) process.exit(1);
          '

  translate:
    name: Fill remaining news locales
    needs: publish
    if: always()
    concurrency:
      group: translate-content
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger news translation backfill
        env:
          APP_URL: ${{ secrets.AUTO_NEWS_APP_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${APP_URL:-https://000-it.com}"
          URL="${BASE_URL%/}/api/cron/translate-content?kinds=news&deadlineMs=180000"
          echo "POST ${URL}"
          HTTP=$(curl -sS -o /tmp/translate-news.json -w "%{http_code}" -X POST \
            -H "Accept: application/json" \
            --max-time 240 \
            "$URL")
          echo "HTTP ${HTTP}"
          head -c 4000 /tmp/translate-news.json; echo
          HTTP_CODE="$HTTP" node -e '
            const fs = require("fs");
            const http = process.env.HTTP_CODE;
            if (http !== "200") {
              console.error("translate-content failed with HTTP", http);
              process.exit(1);
            }
            const data = JSON.parse(fs.readFileSync("/tmp/translate-news.json","utf8"));
            console.log(JSON.stringify({
              ok: data.ok,
              written: data.written,
              skipped: data.skipped,
              failed: data.failed,
              remaining: data.remaining,
            }, null, 2));
            if (data.ok === false) process.exit(1);
          '
