# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Resume machine translation for news, kennisbank, pages, catalog, SEO and UI.
name: Translate content (all locales)

on:
  schedule:
    # Frequent enough to finish 35 locales after new Dutch articles / auto-news / pages.
    - cron: "15 */3 * * *"
    # Shortly after the daily auto-news window (UTC).
    - cron: "40 22 * * *"
    - cron: "10 23 * * *"
  workflow_dispatch:
    inputs:
      kinds:
        description: "Comma-separated kinds: news,kennisbank,pages,ui,slugs (empty = all)"
        required: false
        default: ""

concurrency:
  group: translate-content
  cancel-in-progress: false

jobs:
  translate:
    name: Fill missing translations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger translate-content endpoint
        env:
          APP_URL: ${{ secrets.AUTO_NEWS_APP_URL }}
          KINDS: ${{ github.event.inputs.kinds || '' }}
        run: |
          set -euo pipefail
          BASE_URL="${APP_URL:-https://000-it.com}"
          KINDS_QS=""
          if [[ -n "${KINDS}" ]]; then
            KINDS_QS="&kinds=${KINDS}"
          fi
          # Stay under LiteSpeed's 300s connection timeout (deadline is also capped in the API).
          URL="${BASE_URL%/}/api/cron/translate-content?deadlineMs=180000${KINDS_QS}"
          echo "POST ${URL}"
          HTTP=$(curl -sS -o /tmp/translate-content.json -w "%{http_code}" -X POST \
            -H "Accept: application/json" \
            --max-time 240 \
            "$URL")
          echo "HTTP ${HTTP}"
          head -c 4000 /tmp/translate-content.json; echo
          HTTP_CODE="$HTTP" node -e '
            const fs = require("fs");
            const http = process.env.HTTP_CODE;
            if (http !== "200") {
              console.error("translate-content failed with HTTP", http);
              process.exit(1);
            }
            const data = JSON.parse(fs.readFileSync("/tmp/translate-content.json","utf8"));
            console.log(JSON.stringify({
              ok: data.ok,
              written: data.written,
              skipped: data.skipped,
              failed: data.failed,
              remaining: data.remaining,
              details: (data.details||[]).slice(0, 20),
            }, null, 2));
            if (data.ok === false) process.exit(1);
          '
