# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Build on GitHub, upload .next via ssh, deploy on VPS.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APP_URL: https://000-it.com
  AUTH_URL: https://000-it.com
  AUTH_SECRET: ci-build-placeholder-not-used-at-runtime
  DATABASE_URL: mysql://000it_app:placeholder@127.0.0.1:3306/000it_app

jobs:
  build-and-deploy:
    name: Build and deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check VPS secrets are configured
        id: vps_secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [[ -n "${VPS_HOST:-}" && -n "${VPS_USER:-}" && -n "${VPS_SSH_KEY:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set VPS_HOST, VPS_USER=root, VPS_SSH_KEY (deploy key, no passphrase)."
          fi

      - name: Require VPS secrets (deploy cannot run without them)
        if: steps.vps_secrets.outputs.configured != 'true'
        run: |
          echo "::error::Add VPS_HOST, VPS_USER, VPS_SSH_KEY in Settings → Secrets → Actions."
          exit 1

      - name: Checkout
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git init
          git remote add origin "$REPO_URL"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD

      - name: Setup Node.js
        run: |
          node -v
          npm -v
          node -e "const m = process.versions.node.match(/^(\\d+)/); if (!m || +m[1] < 20) { console.error('Node 20+ required'); process.exit(1); }"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package Next.js build
        run: |
          if [[ ! -f .next/BUILD_ID ]]; then
            echo "::error::next build did not produce .next/BUILD_ID"
            ls -la
            exit 1
          fi
          # Runtime uses `next start` (see scripts/deploy.sh), not the standalone server.
          # Exclude cache/standalone/diagnostics so the upload stays small and reliable.
          echo "==> .next size breakdown (before package)"
          du -sh .next .next/* 2>/dev/null | sort -hr | head -30
          tar -czf next-build.tar.gz \
            --exclude='.next/cache' \
            --exclude='.next/trace' \
            --exclude='.next/types' \
            --exclude='.next/standalone' \
            --exclude='.next/diagnostics' \
            --exclude='.next/analyze' \
            .next
          ls -lh next-build.tar.gz
          BYTES="$(wc -c < next-build.tar.gz | tr -d ' ')"
          # Soft guard: something unexpected ballooned the artifact
          if [[ "$BYTES" -gt 150000000 ]]; then
            echo "::warning::next-build.tar.gz is larger than 150MB (${BYTES} bytes). Check excludes."
          fi

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          # Avoid interactive/profile noise during non-TTY uploads
          TERM: dumb
        run: |
          set -euo pipefail

          PORT="${VPS_SSH_PORT:-22}"
          APP_DIR="${VPS_APP_PATH:-/var/www/000-it.com}"
          REPO_URL="https://github.com/${{ github.repository }}.git"

          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! grep -qE 'BEGIN (OPENSSH |RSA )?PRIVATE KEY' ~/.ssh/deploy_key; then
            echo "::error::VPS_SSH_KEY must be a private key file (BEGIN … PRIVATE KEY)."
            exit 1
          fi

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY cannot be used by GitHub (passphrase-protected or invalid)."
            exit 1
          fi

          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # -T: no TTY (stops login-shell/motd hangs). Compression=no: archive is already gzipped.
          SSH_BASE=(-i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=30 -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o TCPKeepAlive=yes -o Compression=no -o RequestTTY=no)
          SSH_OPTS=("${SSH_BASE[@]}" -p "$PORT" -T)
          SCP_OPTS=("${SSH_BASE[@]}" -P "$PORT" -o StrictHostKeyChecking=accept-new)

          echo "==> SSH ${VPS_USER}@${VPS_HOST}:${PORT} → ${APP_DIR}"

          if ! ssh "${SSH_OPTS[@]}" "${VPS_USER}@${VPS_HOST}" 'echo "SSH OK as $(id -un)"'; then
            echo "::error::SSH auth failed. VPS_USER=root and VPS_SSH_KEY must match /root/.ssh/authorized_keys."
            exit 1
          fi

          echo "==> Free space on VPS /tmp"
          ssh "${SSH_OPTS[@]}" "${VPS_USER}@${VPS_HOST}" 'df -h /tmp /var/tmp / 2>/dev/null | head -20'

          echo "==> Upload pre-built .next to VPS (scp)"
          ls -lh next-build.tar.gz
          # scp is more reliable than piping a large archive through ssh stdin.
          # 20m budget — slow GitHub→VPS links have stalled ~373MB uploads before.
          rm -f /tmp/next-build.tar.gz.upload
          if ! timeout 1200 scp "${SCP_OPTS[@]}" next-build.tar.gz "${VPS_USER}@${VPS_HOST}:/tmp/next-build.tar.gz.upload"; then
            echo "::error::Upload of next-build.tar.gz timed out or failed (scp)."
            ssh "${SSH_OPTS[@]}" "${VPS_USER}@${VPS_HOST}" 'rm -f /tmp/next-build.tar.gz.upload' || true
            exit 1
          fi
          ssh "${SSH_OPTS[@]}" "${VPS_USER}@${VPS_HOST}" \
            'mv -f /tmp/next-build.tar.gz.upload /tmp/next-build.tar.gz && ls -lh /tmp/next-build.tar.gz && test -s /tmp/next-build.tar.gz'

          REMOTE_SCRIPT="$(mktemp)"
          trap 'rm -f "$REMOTE_SCRIPT"' EXIT
          cat > "$REMOTE_SCRIPT" <<'REMOTE'
          set -euo pipefail
          : "${APP_DIR:?}"
          : "${REPO_URL:?}"

          git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true

          if [[ ! -d "$APP_DIR/.git" ]]; then
            PARENT="$(dirname "$APP_DIR")"
            mkdir -p "$PARENT"
            if [[ ! -d "$APP_DIR" ]] || [[ -z "$(ls -A "$APP_DIR" 2>/dev/null)" ]]; then
              git clone "$REPO_URL" "$APP_DIR"
            else
              ENV_BACKUP=""
              [[ -f "$APP_DIR/.env" ]] && ENV_BACKUP="$(mktemp)" && cp "$APP_DIR/.env" "$ENV_BACKUP"
              cd "$APP_DIR"
              git init -b main
              git remote add origin "$REPO_URL" 2>/dev/null || git remote set-url origin "$REPO_URL"
              git fetch origin main
              git reset --hard origin/main
              # Keep runtime uploads (news covers) and env — do not wipe with git clean
              git clean -fd -e .env -e public/uploads -e 'public/uploads/**'
              [[ -n "$ENV_BACKUP" ]] && cp "$ENV_BACKUP" .env && rm -f "$ENV_BACKUP"
            fi
          fi

          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main
          # Preserve news cover JPGs written by the daily auto-news cron
          git clean -fd -e .env -e public/uploads -e 'public/uploads/**'
          echo "==> $(git log -1 --oneline)"

          echo "==> Install pre-built .next from CI"
          rm -rf .next
          tar -xzf /tmp/next-build.tar.gz -C .
          rm -f /tmp/next-build.tar.gz
          if [[ ! -f .next/BUILD_ID ]]; then
            echo "ERROR: extracted .next is missing BUILD_ID"
            exit 1
          fi

          chmod +x scripts/deploy.sh 2>/dev/null || true
          SKIP_BUILD=1 bash scripts/deploy.sh
          curl -sf -o /dev/null -w "000-it :3066 HTTP %{http_code}\n" http://127.0.0.1:3066/ || echo "WARN: :3066 not reachable"
          REMOTE

          if ! ssh "${SSH_OPTS[@]}" "${VPS_USER}@${VPS_HOST}" \
            "APP_DIR=$(printf '%q' "$APP_DIR") REPO_URL=$(printf '%q' "$REPO_URL") bash -s" < "$REMOTE_SCRIPT"; then
            echo "::error::Deploy SSH session failed."
            exit 1
          fi
          echo "==> Deploy SSH session finished OK"
